# MOZU CI — what every push must pass. The test plan (docs/TESTING-PLAN.md §4)
# explains what each layer catches and why it is here.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 18 * * *'   # nightly, 02:17 Taipei: the large fuzz run
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, unit, golden scans, build, e2e
    runs-on: ubuntu-24.04   # ubuntu-latest became 26.04, which Playwright 1.56 and setup-swift do not support yet
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  swift-parity:
    name: Swift ⇄ TypeScript parity (the iPad's geometry)
    runs-on: ubuntu-24.04   # ubuntu-latest became 26.04, which Playwright 1.56 and setup-swift do not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:parity

  ios-build:
    name: iPad app — full Xcode build (SwiftUI included)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Build for device, unsigned
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MozuScanner.xcodeproj \
            -scheme MozuScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)'
      # What scripts/testflight.sh uploads: the Release archive. Signing
      # needs the developer's account, so it is checked unsigned here — the
      # optimised build compiles, and the app carries what App Store Connect
      # refuses a build without.
      - name: Archive for TestFlight (Release, unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MozuScanner.xcodeproj \
            -scheme MozuScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MozuScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(date +%Y%m%d%H%M)" \
            archive | tee archive.log | grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)'
      - name: Check what App Store Connect checks
        working-directory: apps/ios
        run: |
          APP=build/MozuScanner.xcarchive/Products/Applications/MozuScanner.app
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::privacy manifest missing from the app"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::asset catalog (app icon) missing from the app"; exit 1; }
          icon=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$APP/Info.plist")
          [ "$icon" = AppIcon ] || { echo "::error::app icon not set (got '$icon')"; exit 1; }
          crypto=$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Info.plist")
          [ "$crypto" = false ] || { echo "::error::ITSAppUsesNonExemptEncryption should be false"; exit 1; }
          echo "version $(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist") build $(plutil -extract CFBundleVersion raw "$APP/Info.plist") — ready for App Store Connect"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            apps/ios/build.log
            apps/ios/archive.log
          retention-days: 14

  nightly-fuzz:
    name: Nightly — 45,000 badly scanned rooms
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04   # ubuntu-latest became 26.04, which Playwright 1.56 and setup-swift do not support yet
    timeout-minutes: 20
    strategy:
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run wallLoop.fuzz
        env:
          FUZZ_ROOMS: '15000'
          FUZZ_SEED: ${{ matrix.seed }}
